<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>અમાન સેલ્સ એજન્સી</title>

<link rel="stylesheet" href="style.css">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</head>

<body>

<div class="container">

<h1>અમાન સેલ્સ એજન્સી</h1>

<div class="customer">

<input
type="text"
id="party"
placeholder="👤 પાર્ટીનું નામ">

<input
type="text"
id="village"
placeholder="🏠 ગામ">

<input
type="tel"
id="mobile"
placeholder="📱 મોબાઇલ નંબર">

<input
type="date"
id="date">

</div>

<input
type="text"
id="search"
placeholder="🔍 આઇટમ શોધો...">

<table>

<thead>

<tr>

<th>આઇટમ</th>

<th>ભાવ</th>

<th>Qty</th>

<th>કુલ</th>

</tr>

</thead>

<tbody id="orderTable">
    
    </tbody>

</table>

<div class="footer">

<h2>

Grand Total :
₹ <span id="grandTotal">0</span>

</h2>

</div>

<!-- Payment Section -->

<div class="payment-box">

<input
type="number"
id="online"
placeholder="💳 Online Payment">

<input
type="number"
id="cash"
placeholder="💵 Cash Payment">

</div>

<!-- Action Buttons -->

<div class="buttons">

<button onclick="saveImage()">
📷 ફોટો સેવ કરો
</button>

<button onclick="previewBill()">
🧾 બિલ બનાવો
</button>

<button onclick="clearOrder()">
🗑️ ક્લિયર
</button>

</div>

</div>

<!-- ===========================
BILL PREVIEW POPUP
=========================== -->

<div id="previewBox" class="preview-box">

<div class="preview-card">

<div id="billPreview">

<!-- JavaScript અહીં બિલ બનાવશે -->

</div>

<div class="preview-buttons">

    <button onclick="submitBill()">
        ✅ Submit
    </button>

    <button onclick="closeBill()">
        ❌ Cancel
    </button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
